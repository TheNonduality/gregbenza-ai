<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The spark: the site's one repeated mark (see AskButtons.astro), the same
       glyph that sits on every "ask your AI" control. Not a logo — Greg does not
       have one and does not want one; this is the handshake mark standing in.

       Carries its own dark tile rather than a transparent ground: a favicon has
       to read on a light tab bar and a dark one, and only one file gets served,
       so the tile supplies the contrast instead of hoping for it.

       Two departures from the inline version, both for legibility at 16px:
       the star is filled rather than stroked (a stroked 8px star turns to mush),
       and it is scaled up relative to the brackets so it does not read as a dot. -->
  <rect width="32" height="32" rx="6" fill="#121216"/>
  <g fill="none" stroke="#00b8d9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.25 6.8 5.65 16l4.6 9.2"/>
    <path d="M21.75 6.8 26.35 16l-4.6 9.2"/>
  </g>
  <path d="M16 10.75 17.95 14.05 21.25 16 17.95 17.95 16 21.25 14.05 17.95 10.75 16 14.05 14.05Z" fill="#00b8d9"/>
</svg>
